<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPERATION: FORTY-FIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#B8B0A6;--sf:#FAFAFA;--sf2:#F0ECE6;
  --pk:#E6007E;--gn:#00A651;--bl:#0072CE;--gd:#FFC220;--or:#FF5E00;--rd:#E60012;--prp:#8B45A6;
  --tx:#1A1714;--mt:#706B64;
  --fd:'Permanent Marker',cursive;--fb:'Space Grotesk',sans-serif
}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:16px;-webkit-tap-highlight-color:transparent}

/* BRICK WALL TEXTURE */
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(180deg,
      transparent 0px, transparent 26px,
      rgba(0,0,0,.04) 26px, rgba(0,0,0,.04) 28px
    ),
    repeating-linear-gradient(90deg,
      transparent 0px, transparent 56px,
      rgba(0,0,0,.025) 56px, rgba(0,0,0,.025) 58px
    );
  background-size: 58px 28px;
}
/* Offset every other brick row */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,
      transparent 0px, transparent 56px,
      rgba(0,0,0,.025) 56px, rgba(0,0,0,.025) 58px
    );
  background-size: 58px 56px;
  background-position: 29px 28px;
}

/* PAINT DRIPS running down the brick wall */
.drips{position:fixed;top:0;left:0;right:0;height:100%;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg, var(--pk) 0px, var(--pk) 120px, transparent 120px) 6% 0/7px 140px no-repeat,
    linear-gradient(180deg, var(--bl) 0px, var(--bl) 80px, transparent 80px) 93% 0/6px 95px no-repeat,
    linear-gradient(180deg, var(--gd) 0px, var(--gd) 160px, transparent 160px) 15% 0/5px 175px no-repeat,
    linear-gradient(180deg, var(--gn) 0px, var(--gn) 55px, transparent 55px) 81% 0/5px 65px no-repeat,
    linear-gradient(180deg, var(--or) 0px, var(--or) 95px, transparent 95px) 44% 0/5px 110px no-repeat,
    linear-gradient(180deg, var(--prp) 0px, var(--prp) 70px, transparent 70px) 58% 0/4px 80px no-repeat,
    linear-gradient(180deg, var(--rd) 0px, var(--rd) 105px, transparent 105px) 72% 0/4px 115px no-repeat;
  opacity:.6}

.app{height:100%;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1}
.app::-webkit-scrollbar{width:4px}.app::-webkit-scrollbar-thumb{background:var(--pk)}

.title{font-family:var(--fd);font-size:clamp(1.8rem,6vw,3rem);letter-spacing:1px;line-height:1.15;color:var(--tx)}
.sub{font-size:.75rem;color:var(--mt);text-transform:uppercase;letter-spacing:4px;font-weight:700}
.gp{color:var(--pk)}.go{color:var(--or)}.gg{color:var(--gn)}.gb{color:var(--bl)}

.scr{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:24px 18px 48px;text-align:center;position:relative}
.inn{max-width:460px;width:100%;flex:1;display:flex;flex-direction:column;align-items:center}
.br{font-size:.92rem;line-height:1.8;max-width:420px;margin:10px 0}.br em{color:var(--or);font-style:normal;font-weight:700}.br strong{color:var(--pk);font-weight:700}

.btn{font-family:var(--fb);font-size:.82rem;font-weight:700;padding:14px 32px;border:3px solid var(--tx);background:var(--sf);color:var(--tx);cursor:pointer;text-transform:uppercase;letter-spacing:3px;transition:all .15s;-webkit-appearance:none}
.btn:hover,.btn:active{background:var(--pk);border-color:var(--pk);color:#fff}
.btn-g:hover,.btn-g:active{background:var(--gn);border-color:var(--gn)}
.btn-o:hover,.btn-o:active{background:var(--or);border-color:var(--or)}
.btn-s{padding:10px 18px;font-size:.72rem;letter-spacing:2px}

.cw{display:flex;gap:6px;margin:12px 0;width:100%;max-width:380px}
.ci{flex:1;font-family:var(--fb);font-size:1.05rem;font-weight:700;padding:14px;background:var(--sf);border:3px solid var(--tx);color:var(--tx);text-transform:uppercase;letter-spacing:3px;text-align:center;outline:none}
.ci:focus{border-color:var(--bl)}.ci.er{border-color:var(--rd);animation:shake .4s}.ci.ok{border-color:var(--gn)}

.pg{position:sticky;top:0;z-index:100;width:100%;height:7px;background:rgba(0,0,0,.08)}
.pgf{height:100%;background:linear-gradient(90deg,var(--pk),var(--or),var(--gd),var(--gn),var(--bl),var(--prp));transition:width .6s}

.cl{background:var(--sf);border-left:7px solid var(--rd);padding:15px 18px;margin:14px 0;text-align:left;font-size:.88rem;line-height:1.75;width:100%;max-width:420px;position:relative;box-shadow:3px 3px 0 rgba(0,0,0,.06)}
.cl::after{content:'';position:absolute;left:-7px;bottom:-18px;width:7px;height:18px;background:var(--rd);border-radius:0 0 5px 5px;opacity:.35}
.cl .lb{color:var(--rd);font-size:.65rem;text-transform:uppercase;letter-spacing:4px;margin-bottom:6px;font-weight:700}
.cl.blue{border-color:var(--bl)}.cl.blue .lb{color:var(--bl)}.cl.blue::after{background:var(--bl)}
.cl.pink{border-color:var(--pk)}.cl.pink .lb{color:var(--pk)}.cl.pink::after{background:var(--pk)}
.cl.orn{border-color:var(--or)}.cl.orn .lb{color:var(--or)}.cl.orn::after{background:var(--or)}
.cl.grn{border-color:var(--gn)}.cl.grn .lb{color:var(--gn)}.cl.grn::after{background:var(--gn)}

.kb{display:flex;gap:4px;justify-content:center;margin:14px 0}
.ky{width:44px;height:68px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-family:var(--fb);font-size:.75rem;font-weight:700;cursor:pointer;border:3px solid var(--tx);background:var(--sf);color:var(--tx);transition:all .1s;user-select:none;-webkit-user-select:none}
.ky:active,.ky.ac{background:var(--bl);border-color:var(--bl);color:#fff;transform:scaleY(.95);transform-origin:top}
.tn{display:flex;gap:5px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.tn-n{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border:3px solid var(--tx);color:var(--mt);background:var(--sf)}
.tn-n.d{border-color:var(--gn);color:#fff;background:var(--gn)}
.tn-n.c{border-color:var(--or);color:var(--or);animation:pulse 1s infinite}

.qq{font-size:.92rem;line-height:1.8;text-align:left;max-width:420px;margin:12px 0}
.qc{font-size:.68rem;color:var(--mt);text-transform:uppercase;letter-spacing:3px;font-weight:700}
.qh{background:var(--sf2);border:2px solid #D4CEC6;padding:10px 14px;margin:8px 0;font-size:.85rem;color:var(--or);text-align:left;max-width:420px;width:100%}
.qs{font-size:.85rem;margin:5px 0;min-height:1.2em;font-weight:600}

.sp-z{position:relative;width:100%;max-width:400px;height:180px;margin:14px 0;border:3px solid var(--tx);overflow:hidden;cursor:crosshair;touch-action:none;background:#999}
.sp-h{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:clamp(1.2rem,5vw,1.7rem);color:var(--pk);letter-spacing:4px;padding:10px}
.sp-c{position:absolute;inset:0}

.ac{background:var(--sf);border:3px solid var(--tx);padding:26px 22px;max-width:400px;width:100%;margin:18px 0;position:relative;box-shadow:5px 5px 0 rgba(0,0,0,.08)}
.ac::before{content:'♥';position:absolute;top:8px;right:14px;font-size:1.5rem;color:var(--pk);opacity:.2}
.ac .cn{font-family:var(--fd);font-size:1.7rem;color:var(--pk)}
.ac .rn{color:var(--mt);font-size:.75rem;margin-top:3px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.ac .dv{width:50px;height:5px;background:var(--pk);margin:16px auto}
.ac .mt{font-size:.85rem;line-height:1.7;white-space:pre-line}
.ac .cd{font-family:var(--fd);font-size:1.8rem;color:var(--gn);margin:14px 0;letter-spacing:4px}

.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:400px;margin:18px 0}
.ab{font-family:var(--fb);font-weight:700;padding:16px 6px;background:var(--sf);border:3px solid var(--tx);color:var(--tx);cursor:pointer;font-size:.88rem;transition:all .15s;box-shadow:3px 3px 0 rgba(0,0,0,.06)}
.ab:hover,.ab:active{border-color:var(--pk);color:var(--pk);box-shadow:3px 3px 0 var(--pk)}
.ab .sm{font-size:.62rem;color:var(--mt);display:block;margin-top:4px;font-weight:600;letter-spacing:1px;text-transform:uppercase}

.hb{font-size:1.25rem;direction:rtl;text-align:right;line-height:2;color:var(--bl);font-family:'Times New Roman',serif}

.cr-r{display:flex;gap:6px;align-items:flex-start;margin:10px 0;width:100%;max-width:420px}
.cr-n{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;border:3px solid var(--tx);color:var(--mt);flex-shrink:0;margin-top:2px;background:var(--sf)}
.cr-n.d{border-color:var(--gn);color:#fff;background:var(--gn)}
.cr-c{text-align:left;font-size:.85rem;line-height:1.6;flex:1}
.cr-i{font-family:var(--fb);font-size:.82rem;font-weight:700;padding:8px;background:var(--sf);border:3px solid var(--tx);color:var(--tx);outline:none;width:128px;text-transform:uppercase;flex-shrink:0}
.cr-i:focus{border-color:var(--bl)}.cr-i.ok{border-color:var(--gn);color:var(--gn)}.cr-i.er{border-color:var(--rd);animation:shake .4s}

.cc-c{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.cc{position:absolute;top:-20px;animation:cfl linear forwards}
@keyframes cfl{to{top:110vh;transform:rotate(720deg)}}

.spl{position:fixed;border-radius:35% 65% 45% 55%;pointer-events:none;z-index:0;opacity:.15}

.scr-slots{display:flex;gap:5px;justify-content:center;margin:12px 0}
.scr-slot{width:46px;height:52px;border:3px solid var(--or);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1.5rem;color:var(--mt);background:var(--sf)}
.scr-slot.filled{color:var(--gn);border-color:var(--gn)}
.scr-tiles{display:flex;gap:5px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.scr-tile{width:48px;height:54px;border:3px solid var(--pk);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1.5rem;color:var(--pk);background:var(--sf);cursor:pointer;transition:all .12s;box-shadow:2px 2px 0 rgba(230,0,126,.12)}
.scr-tile:active{background:var(--pk);color:#fff}
.scr-tile.used{opacity:.1;pointer-events:none;box-shadow:none}
.scr-wrong{animation:shake .4s}

.mem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:220px;margin:16px auto}
.mem-pad{width:96px;height:96px;border:4px solid;cursor:pointer;transition:all .15s;opacity:.15;background:var(--sf)}
.mem-pad.lit{opacity:1;background:currentColor !important}
.mem-pad:active{opacity:.5}
.mem-status{font-size:.88rem;margin:12px 0;min-height:1.2em;font-weight:700}
.mem-level{font-size:.65rem;color:var(--mt);text-transform:uppercase;letter-spacing:3px;font-weight:700}

.upload-btn{display:inline-block;font-family:var(--fb);font-size:.78rem;font-weight:700;padding:16px 30px;border:3px dashed var(--bl);color:var(--bl);cursor:pointer;text-transform:uppercase;letter-spacing:3px;margin:14px 0;background:var(--sf)}
.upload-btn:active{background:rgba(0,114,206,.06)}
.upload-preview{max-width:280px;width:100%;margin:10px 0;border:3px solid var(--tx)}
.translating{animation:flicker 1.2s infinite;color:var(--bl);font-size:.9rem;font-weight:700;letter-spacing:2px}

.dimg{width:100%;max-width:260px;margin:14px 0;border:5px solid var(--tx);box-shadow:6px 6px 0 var(--pk)}
.mimg{width:100%;max-width:300px;margin:12px 0;border:5px solid var(--tx);box-shadow:6px 6px 0 var(--bl)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.25}}
.fu{animation:fadeUp .5s ease-out both}
.f1{animation-delay:.1s}.f2{animation-delay:.2s}.f3{animation-delay:.3s}.f4{animation-delay:.4s}.f5{animation-delay:.55s}.f6{animation-delay:.7s}

.sep{width:50px;height:5px;background:var(--pk);margin:16px auto}
.done-flash{color:var(--gn);font-size:.9rem;margin-bottom:10px;font-weight:700}
</style>
</head>
